<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Prediction Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:       #eef1f5;
    --surface:  #ffffff;
    --border:   #dde1e7;
    --text:     #14181f;
    --muted:    #667085;
    --accent:   #c2410c;
    --low:      #22c55e;
    --medium:   #f59e0b;
    --high:     #f97316;
    --very_high:#ef4444;
    --mono: 'Space Grotesk', sans-serif;
    --sans: 'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    /* 100vh on iOS Safari is measured with its address bar hidden, i.e.
       taller than what's actually on screen when it's showing — the page
       ends up taller than the visible area, so Safari can shift the whole
       viewport (address bar collapses) and the fixed 52px header slides up
       under the iPhone's status bar. 100dvh tracks the REAL visible height
       as Safari's chrome shows/hides, so the header never moves. Kept as a
       fallback pair (not an @supports block) so browsers without dvh just
       keep using the vh line above it. */
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    display: grid;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 320px 1fr;
    transition: grid-template-columns .25s ease;
  }
  body.sidebar-collapsed { grid-template-columns: 0px 1fr; }

  #sidebar-toggle {
    position: fixed;
    top: 78px;
    left: 320px;
    transform: translateX(-50%);
    z-index: 1000;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    line-height: 1;
    transition: left .25s ease;
  }
  #sidebar-toggle:hover { color: var(--accent); border-color: var(--accent); }
  body.sidebar-collapsed #sidebar-toggle { left: 12px; }

  /* dimmed backdrop behind the sidebar when it's an overlay (small screens
     only, see the responsive block at the end of this stylesheet) */
  #sidebar-backdrop { display: none; }

  /* ── header ── */
  header {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--accent);
  }
  .logo span { color: var(--muted); }
  #conn-status {
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
  }
  #conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  #conn-dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  /* ── sidebar ── */
  aside {
    grid-column: 1;
    grid-row: 2;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* Explicit placement (not left to auto-placement) so the map pane always
     lands in the 1fr column — the responsive block below turns `aside`
     into `position:fixed` on phones, which takes it out of grid flow, and
     without an explicit grid-column the map pane would auto-place into
     aside's now-empty (0px) column instead of its own, collapsing to zero
     width. */
  #map-pane { grid-column: 2; grid-row: 2; }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 16px 16px 8px;
    border-bottom: 1px solid var(--border);
  }

  /* active bus card */
  #bus-card {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  #bus-card #line-select {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    width: 100%;
    margin-bottom: 16px;
    cursor: pointer;
  }
  #bus-card #line-select:hover { border-color: var(--accent); }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .stat-unit {
    font-size: 12px;
    color: var(--muted);
    margin-left: 2px;
  }

  /* occupancy bar */
  .occ-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .occ-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .occ-title { font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: .06em; }
  .occ-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--low);
    color: #000;
    text-transform: uppercase;
    font-weight: 700;
  }
  #s-selected-bus {
    display: block;
    width: 100%;
    background: var(--bg);
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 8px;
    cursor: default;
    box-sizing: border-box;
  }
  .occ-track {
    background: var(--bg);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .occ-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .6s ease, background .4s ease;
    background: var(--low);
  }
  .occ-pct {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  /* ── map ── */
  #map {
    width: 100%;
    height: 100%;
    background: var(--bg);
  }
  .leaflet-container { background: var(--bg); }

  /* bus marker */
  .bus-marker-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bus-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-sizing: border-box;
    animation-duration: 2s;
    animation-iteration-count: infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
  }
  .bus-dot.selected { border-width: 4px; }
  /* One named pulse per bus identity color (bus-dot's glow can't just read
     an inline box-shadow — @keyframes fully defines that property for every
     frame, overriding whatever was set inline — so each bus color gets its
     own keyframe instead of trying to parameterize one). */
  @keyframes busPulseCyan {
    0%, 100% { box-shadow: 0 0 0 4px rgba(8,145,178,.3), 0 0 12px rgba(8,145,178,.5); }
    50%      { box-shadow: 0 0 0 8px rgba(8,145,178,.12), 0 0 20px rgba(8,145,178,.35); }
  }
  @keyframes busPulseLime {
    0%, 100% { box-shadow: 0 0 0 4px rgba(132,204,22,.3), 0 0 12px rgba(132,204,22,.5); }
    50%      { box-shadow: 0 0 0 8px rgba(132,204,22,.12), 0 0 20px rgba(132,204,22,.35); }
  }
  @keyframes busPulseViolet {
    0%, 100% { box-shadow: 0 0 0 4px rgba(124,58,237,.3), 0 0 12px rgba(124,58,237,.5); }
    50%      { box-shadow: 0 0 0 8px rgba(124,58,237,.12), 0 0 20px rgba(124,58,237,.35); }
  }
  @keyframes busPulsePink {
    0%, 100% { box-shadow: 0 0 0 4px rgba(219,39,119,.3), 0 0 12px rgba(219,39,119,.5); }
    50%      { box-shadow: 0 0 0 8px rgba(219,39,119,.12), 0 0 20px rgba(219,39,119,.35); }
  }

  /* user location marker */
  .my-location-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .my-location-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    border: 2px solid #fff;
    box-shadow: 0 0 0 4px rgba(59,130,246,.3), 0 0 10px rgba(59,130,246,.5);
  }

  /* floating text label anchored below a marker — "Estás aquí" under the
     user's location, "Esta es tu parada más cercana" under the highlighted
     nearest stop. Absolutely positioned off a `position:relative` parent
     sized to the marker itself, so it doesn't get clipped by the (small)
     divIcon box. Each variant below sets its own (non-black) background —
     matching that marker's own color — so the two never look identical
     and neither reads as an error/warning box. */
  .map-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 10px;
    white-space: nowrap;
    color: #fff;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 5px;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    z-index: 5;
  }
  .map-label-here     { background: #3b82f6; } /* matches the user-location dot */
  .map-label-nearest  { background: #ec4899; } /* matches the nearest-stop ring */

  /* bus occupancy popup — shown right on the map when a bus marker is
     tapped, so occupancy is visible without opening the sidebar (the
     sidebar alone isn't enough on phones: it covers most of the screen,
     hiding the very buses it's describing). */
  .bus-popup .leaflet-popup-content-wrapper {
    background: rgba(20,24,31,.94);
    color: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .bus-popup .leaflet-popup-content { margin: 10px 14px; text-align: center; }
  .bus-popup .leaflet-popup-tip { background: rgba(20,24,31,.94); }
  .bus-popup-title {
    font-family: var(--mono);
    font-size: 11px;
    color: #cbd5e1;
    letter-spacing: .05em;
    margin-bottom: 4px;
  }
  .bus-popup-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: #000;
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .bus-popup-pct { font-family: var(--mono); font-size: 13px; color: #fff; }
  .bus-popup-people {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    margin: 3px 0 5px;
  }
  .bus-popup-person { display: block; }

  /* numbered stop markers */
  .stop-marker-wrap { position: relative; }
  .stop-pulse {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
    animation-timing-function: ease-out;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
    pointer-events: none;
  }
  .stop-dot {
    position: relative;
    z-index: 2;
    border-radius: 50%;
    color: #fff;
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  @keyframes stopPulse {
    0%   { transform: scale(1);   opacity: .55; }
    70%  { transform: scale(2.1); opacity: 0; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  @keyframes stopPulseActive {
    0%   { transform: scale(1);   opacity: .8; }
    60%  { transform: scale(2.5); opacity: 0; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* Selection rings — one per selector (my-stop / origin / destination) so
     picking the same stop in more than one selector shows as concentric
     rings instead of one style overwriting another. */
  .stop-select-ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    border: 3px solid;
    box-sizing: border-box;
    pointer-events: none;
  }
  /* The "nearest stop to you" ring specifically (not the trip-planner one)
     gets a thicker border + a pulsing glow so it reads as "the recommended
     one" at a glance, instead of looking like just another selection. */
  .stop-select-ring-nearest {
    border-width: 4px;
    animation: nearestRingPulse 1.6s ease-out infinite;
  }
  @keyframes nearestRingPulse {
    0%   { box-shadow: 0 0 0 0 rgba(236,72,153,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(236,72,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(236,72,153,0); }
  }

  /* hover tooltip for stop markers */
  .stop-tooltip {
    background: rgba(20,24,31,.92);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 9px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .leaflet-tooltip-top.stop-tooltip::before {
    border-top-color: rgba(20,24,31,.92); /* recolor Leaflet's built-in arrow, don't hide it */
  }

  /* ── no data state ── */
  #no-data {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--muted);
    pointer-events: none;
    z-index: 999;
  }
  #no-data .big { font-size: 32px; margin-bottom: 8px; }
  #no-data p { font-size: 13px; font-family: var(--mono); }

  /* ── trip planner / my-stop widget ── */
  #trip-section, #my-stop-widget { padding: 16px; border-bottom: 1px solid var(--border); }
  .trip-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  #trip-section select, #my-stop-widget select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 13px;
    width: 100%;
    min-width: 0;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  #trip-calc-btn, #my-stop-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 10px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
  }
  #trip-calc-btn:hover, #my-stop-btn:hover { opacity: .85; }
  #trip-result, #my-stop-result {
    margin-top: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    display: none;
  }
  #trip-result .trip-line, #my-stop-result .trip-line { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #trip-result .trip-line:last-child, #my-stop-result .trip-line:last-child { margin-bottom: 0; }
  #trip-result .trip-label, #my-stop-result .trip-label { color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
  #trip-result .trip-value, #my-stop-result .trip-value { font-weight: 600; }
  #trip-error, #my-stop-error { color: var(--very_high); font-size: 12px; margin-top: 8px; display: none; }

  /* ── language toggle ── */
  #lang-toggle {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
  }
  #lang-toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* ── responsive: phones / narrow tablets ──────────────────────────────
     Below this width the fixed 320px sidebar would eat almost the whole
     screen and hide the map (and the buses on it). The sidebar becomes a
     slide-in overlay instead of a grid column — the map always stays
     full-bleed underneath it. */
  @media (max-width: 720px) {
    body { grid-template-columns: 0px 1fr; }
    body.sidebar-collapsed { grid-template-columns: 0px 1fr; }

    aside {
      position: fixed;
      top: 52px; left: 0; bottom: 0;
      width: min(86vw, 320px);
      z-index: 1400;
      box-shadow: 2px 0 20px rgba(0,0,0,.3);
      transform: translateX(-100%);
      transition: transform .25s ease;
    }
    body:not(.sidebar-collapsed) aside { transform: translateX(0); }

    #sidebar-toggle {
      top: auto;
      bottom: 16px;
      left: 12px !important;
      transform: none;
      width: 40px; height: 40px;
      font-size: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    body:not(.sidebar-collapsed) #sidebar-toggle { left: calc(min(86vw, 320px) + 12px) !important; }

    body:not(.sidebar-collapsed) #sidebar-backdrop {
      display: block;
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      background: rgba(15,18,24,.4);
      z-index: 1300;
    }
  }

  @media (max-width: 420px) {
    header { padding: 0 10px; }
    .logo { font-size: 11px; }
    #conn-label { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">BUS PREDICTION</div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div id="conn-status">
      <div id="conn-dot"></div>
      <span id="conn-label" data-i18n="waitingData">esperando datos…</span>
    </div>
    <button id="lang-toggle" title="Cambiar idioma / Switch language">EN</button>
  </div>
</header>

<button id="sidebar-toggle" title="Ocultar/mostrar panel · Hide/show panel">‹</button>
<div id="sidebar-backdrop"></div>

<!-- sidebar -->
<aside>
  <div id="bus-card">
    <select id="line-select" title="Elegir línea / Choose line"></select>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label" data-i18n="eta">ETA</div>
        <div class="stat-value" id="s-eta">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label" data-i18n="nextStop">Next stop</div>
        <div class="stat-value" id="s-next-stop" style="font-size:13px;">—</div>
      </div>
    </div>
  </div>

  <div class="occ-section">
    <div class="occ-header">
      <span class="occ-title" data-i18n="occupancy">OCCUPANCY</span>
      <span class="occ-badge" id="s-occ-badge">—</span>
    </div>
    <div id="s-selected-bus" title="Tocá un bus en el mapa para elegirlo / Tap a bus on the map to pick it">Bus 001</div>
    <div class="occ-track"><div class="occ-fill" id="s-occ-fill" style="width:0%"></div></div>
    <div class="occ-pct" id="s-occ-pct">0%</div>
  </div>

  <div class="section-label" data-i18n="myStopSection">When does my bus arrive?</div>
  <div id="my-stop-widget" style="padding:16px; border-bottom:1px solid var(--border);">
    <div class="trip-row">
      <div style="display:flex; gap:8px; min-width:0;">
        <select id="my-stop-select" style="flex:1; min-width:0;"></select>
        <button id="use-location-btn" title="" style="flex-shrink:0; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:0 12px; cursor:pointer; font-size:15px;">📍</button>
      </div>
      <button id="my-stop-btn" data-i18n="checkEta">Check arrival</button>
    </div>
    <div id="my-stop-error" style="color:var(--very_high); font-size:12px; margin-top:4px; display:none;"></div>
    <div id="my-stop-result" style="margin-top:10px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:12px; display:none;">
      <div class="trip-line">
        <span class="trip-label" data-i18n="etaToOrigin">ETA to origin</span>
        <span class="trip-value" id="my-stop-eta">—</span>
      </div>
      <div class="trip-line">
        <span class="trip-label" data-i18n="arrivalTime">Arrival time</span>
        <span class="trip-value" id="my-stop-arrival">—</span>
      </div>
    </div>
  </div>

  <div class="section-label" data-i18n="tripPlanner">Plan a trip (A → B)</div>
  <div id="trip-section">
    <div class="trip-row">
      <select id="trip-origin"></select>
      <select id="trip-destination"></select>
      <button id="trip-calc-btn" data-i18n="calculate">Calculate</button>
    </div>
    <div id="trip-error" data-i18n-key="tripError"></div>
    <div id="trip-result">
      <div class="trip-line" style="margin-bottom:0;">
        <span class="trip-label" data-i18n="tripDuration">Trip duration</span>
        <span class="trip-value" id="trip-duration" style="font-size:18px;">—</span>
      </div>
    </div>
  </div>
</aside>

<!-- map -->
<div id="map-pane" style="position:relative; overflow:hidden;">
  <div id="map"></div>
  <div id="no-data">
    <div class="big">🚌</div>
    <p data-i18n="noDataHint">Iniciá el simulator.py<br>para ver el bus en tiempo real</p>
  </div>
</div>

<script>
// ── config ──────────────────────────────────────────────────────────────
const WS_URL      = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
const PREDICT_URL = window.location.origin + '/predict/eta/broadcast';
const TRIP_URL     = window.location.origin + '/predict/trip';

// ── formatting helpers ──────────────────────────────────────────────────
// Below 60s: seconds only ("45 s"). At 60s or more (and under an hour):
// minutes plus any leftover seconds, never rounded away ("1 min 10 s",
// "3 min 45 s" — but just "3 min" when it lands on an exact minute). An
// hour or more still rolls over to "Nh Mmin" (durations this long don't
// come up in practice for a single bus leg, but the rollover avoids ever
// printing something like "125 min").
function formatDuration(totalMinutes) {
  if (totalMinutes == null || isNaN(totalMinutes)) return '—';
  let totalSeconds = Math.round(totalMinutes * 60);
  const hours = Math.floor(totalSeconds / 3600);
  totalSeconds -= hours * 3600;
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds - minutes * 60;

  if (hours > 0) return minutes > 0 ? `${hours} h ${minutes} min` : `${hours} h`;
  if (minutes > 0) return seconds > 0 ? `${minutes} min ${seconds} s` : `${minutes} min`;
  return `${seconds} s`;
}

// ── i18n ─────────────────────────────────────────────────────────────────
const I18N = {
  es: {
    waitingData: 'esperando datos…', connectingLive: 'Conectando · En vivo',
    disconnectedRetry: 'desconectado · reintentando…',
    eta: 'ETA', nextStop: 'Próxima Parada', occupancy: 'OCUPACIÓN',
    tripPlanner: 'Planificador de Viaje', calculate: 'Calcular',
    etaToOrigin: 'El bus llega en', tripDuration: 'Duración del viaje', arrivalTime: 'Hora estimada',
    noDataHint: 'Iniciá el simulator.py<br>para ver el bus en tiempo real',
    stopLabel: 'Parada', tripErrorRange: 'El destino no puede estar antes del origen.',
    myStopSection: '¿Cuándo llega mi bus?', checkEta: 'Ver llegada',
    myStopErrorGeneric: 'No se pudo calcular la llegada.',
    useLocationTitle: 'Usar mi ubicación para elegir la parada más cercana',
    locationUnsupported: 'Tu navegador no soporta geolocalización.',
    locationDenied: 'Ubicación denegada para este sitio. En iPhone: tocá "AA" en la barra de direcciones → Configuración del sitio web → Ubicación → Permitir.',
    locationError: 'No se pudo obtener tu ubicación.',
    locationSet: 'Parada más cercana seleccionada según tu ubicación.',
    tripErrorGeneric: 'No se pudo calcular el viaje.',
    busAlreadyPassed: '🚌 El bus ya pasó por esta parada.',
    occLow: 'BAJA', occMedium: 'MEDIA', occHigh: 'ALTA', occVeryHigh: 'MUY ALTA',
    youAreHere: 'Estás aquí', nearestStopLabel: 'Esta es tu parada más cercana',
  },
  en: {
    waitingData: 'waiting for data…', connectingLive: 'Connecting · Live',
    disconnectedRetry: 'disconnected · retrying…',
    eta: 'ETA', nextStop: 'Next Stop', occupancy: 'OCCUPANCY',
    tripPlanner: 'Trip Planner', calculate: 'Calculate',
    etaToOrigin: 'Bus arrives in', tripDuration: 'Trip duration', arrivalTime: 'Estimated time',
    noDataHint: 'Start simulator.py<br>to see the bus in real time',
    stopLabel: 'Stop', tripErrorRange: 'Destination cannot be before the origin.',
    myStopSection: 'When does my bus arrive?', checkEta: 'Check arrival',
    myStopErrorGeneric: 'Could not calculate the arrival.',
    useLocationTitle: 'Use my location to pick the nearest stop',
    locationUnsupported: 'Your browser does not support geolocation.',
    locationDenied: 'Location denied for this site. On iPhone: tap "AA" in the address bar → Website Settings → Location → Allow.',
    locationError: 'Could not get your location.',
    locationSet: 'Nearest stop selected based on your location.',
    tripErrorGeneric: 'Could not calculate the trip.',
    busAlreadyPassed: '🚌 The bus already went past this stop.',
    occLow: 'LOW', occMedium: 'MEDIUM', occHigh: 'HIGH', occVeryHigh: 'VERY HIGH',
    youAreHere: 'You are here', nearestStopLabel: 'This is your nearest stop',
  },
};
let currentLang = 'es';

// Sets `el`'s text from the current language's dict and remembers the key
// (via a data attribute) so applyI18n() can re-render it later — plain
// data-i18n only covers text baked into the HTML at load time; these
// messages (geolocation results, trip-planner errors) are set dynamically
// from JS, so without this they'd stay in whatever language was active
// when they were last shown, even after the user switches languages.
function setDynamicMessage(el, key) {
  el.dataset.i18nDynamic = key;
  el.textContent = I18N[currentLang][key];
}

function applyI18n() {
  const dict = I18N[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });
  document.querySelectorAll('[data-i18n-dynamic]').forEach(el => {
    const key = el.dataset.i18nDynamic;
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
  document.getElementById('lang-toggle').textContent = currentLang === 'es' ? 'EN' : 'ES';
  document.getElementById('use-location-btn').title = dict.useLocationTitle;
  populateStopSelects(); // refresh "Parada N" / "Stop N" option labels
  // Re-run the occupancy pipeline for the selected bus so its map popup
  // (badge label) picks up the new language too, in case it's open.
  if (selectedBus) refreshOccupancyForBus(selectedBus);
  // Refreshes the "Esta es tu parada más cercana" stop label and the
  // "Estás aquí" user-location label, in case either is currently showing.
  refreshAllStopIcons();
  if (myLocationMarker) {
    myLocationMarker.setIcon(makeMyLocationIcon());
    myLocationMarker.setPopupContent(`<b style="font-family:monospace">📍 ${dict.youAreHere}</b>`);
  }
}

document.getElementById('lang-toggle').addEventListener('click', () => {
  currentLang = currentLang === 'es' ? 'en' : 'es';
  applyI18n();
});

// ── map init ─────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false, attributionControl: false })
  .setView([-25.3115, -57.5432], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── sidebar collapse ─────────────────────────────────────────────────────
const sidebarToggle = document.getElementById('sidebar-toggle');

function setSidebarCollapsed(collapsed) {
  document.body.classList.toggle('sidebar-collapsed', collapsed);
  sidebarToggle.textContent = collapsed ? '›' : '‹';
  try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
  // Let the CSS width transition finish before Leaflet re-measures its container.
  setTimeout(() => map.invalidateSize(), 260);
}

sidebarToggle.addEventListener('click', () => {
  setSidebarCollapsed(!document.body.classList.contains('sidebar-collapsed'));
});

// On phones the sidebar is a full overlay (see the responsive CSS block),
// so tapping the dimmed backdrop behind it closes it again — same as
// tapping the toggle button.
document.getElementById('sidebar-backdrop').addEventListener('click', () => setSidebarCollapsed(true));

try {
  const stored = localStorage.getItem('sidebarCollapsed');
  if (stored !== null) {
    setSidebarCollapsed(stored === '1');
  } else if (window.matchMedia('(max-width: 720px)').matches) {
    // First visit on a narrow screen: start with the map full-bleed and
    // the sidebar tucked away, instead of the desktop default of showing it.
    setSidebarCollapsed(true);
  }
} catch (e) {}

// ── route: loaded from backend ──────────────────────────────────────────
// Stop marker colors: not orange/red (route accent + occupancy badges
// already live there) and not the "my location" marker's blue, so all
// three stay visually distinct on the map.
const STOP_COLOR        = '#6366f1'; // indigo — normal stops
const STOP_ACTIVE_COLOR = '#f59e0b'; // gold/amber — the bus's next stop

// Selector highlight ring — one color per GROUP, not per selector: origin
// and destination share the same "trip planner" ring instead of two
// different colors, and only ONE group's ring shows at a time (see
// activeSelectionGroup below) — touching either "¿Cuándo llega mi bus?" or
// the trip planner clears the other's ring entirely, so a stop never ends
// up wearing rings from both at once and confusing which selector it belongs to.
const SELECT_RING_COLORS = {
  myStop:      '#ec4899', // pink — "¿Cuándo llega mi bus?"
  tripPlanner: '#ef4444', // red  — trip planner (origin AND destination)
};

let activeSelectionGroup = null; // 'myStop' | 'tripPlanner' | null — which selector's ring is currently shown

function makeStopIcon(isActive, selection = {}) {
  // Shrunk from 28/22 — with 21 stops along the route, the old size made
  // neighboring circles overlap/blur together at normal zoom levels.
  const size     = isActive ? 20 : 14;
  const color    = isActive ? STOP_ACTIVE_COLOR : STOP_COLOR;
  const anim     = isActive ? 'stopPulseActive' : 'stopPulse';
  const duration = isActive ? '1.3s' : '2.6s';

  const ringColor = selection.myStop ? SELECT_RING_COLORS.myStop
                   : selection.tripPlanner ? SELECT_RING_COLORS.tripPlanner
                   : null;
  const ringHtml = ringColor
    ? `<div class="stop-select-ring${selection.myStop ? ' stop-select-ring-nearest' : ''}" style="width:${size + 12}px;height:${size + 12}px;margin-top:-${(size + 12) / 2}px;margin-left:-${(size + 12) / 2}px;border-color:${ringColor};"></div>`
    : '';
  // Only the "nearest stop to you" selection gets the callout label — the
  // trip-planner's origin/destination rings don't need one, they're already
  // named in their own dropdowns.
  const labelHtml = selection.myStop
    ? `<div class="map-label map-label-nearest">${I18N[currentLang].nearestStopLabel}</div>`
    : '';

  return L.divIcon({
    className: '',
    html: `
      <div class="stop-marker-wrap" style="width:${size}px;height:${size}px;">
        ${ringHtml}
        <div class="stop-pulse" style="background:${color}; animation-name:${anim}; animation-duration:${duration};"></div>
        <div class="stop-dot" style="width:${size}px;height:${size}px;background:${color};"></div>
        ${labelHtml}
      </div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
  });
}

function selectionStateFor(i) {
  const val = id => { const v = document.getElementById(id).value; return v === '' ? null : parseInt(v, 10); };
  if (activeSelectionGroup === 'myStop') {
    return { myStop: i === val('my-stop-select'), tripPlanner: false };
  }
  if (activeSelectionGroup === 'tripPlanner') {
    return { myStop: false, tripPlanner: i === val('trip-origin') || i === val('trip-destination') };
  }
  return { myStop: false, tripPlanner: false };
}

function rebuildStopIcon(i) {
  if (!stopMarkers[i]) return;
  const selection = selectionStateFor(i);
  stopMarkers[i].setIcon(makeStopIcon(i === activeStopIndex, selection));
  // Leaflet stacks markers by screen Y-position by default, so a
  // neighboring stop a bit further "down" the map can render on top of —
  // and visually blend into — this one's overflowing label. Bumping this
  // specific marker's z-index guarantees its ring + label always draw
  // above every other stop marker, regardless of geography.
  stopMarkers[i].setZIndexOffset(selection.myStop ? 1000 : 0);
}

function refreshAllStopIcons() {
  stopMarkers.forEach((_, i) => rebuildStopIcon(i));
}

let ROUTE_STOPS = [];
let STOP_NAMES  = [];
let routeOutline = null;
let routeLayer   = null;
let stopMarkers  = [];
let activeStopIndex = null; // index of ROUTE_STOPS closest to the bus right now

// Each line runs exactly one bus (see raspberry-pi/simulator.py's LINES
// registry: "38" -> bus_001, "15-1" -> bus_002). Route track color is keyed
// by bus_id — not orange/red (--accent/--high/--very_high already use that
// range) and not blue (already used by the "my location" marker) — so two
// buses' tracks stay visually distinct from each other and from the rest
// of the UI, and adding a third bus later is just one more color entry.
const LINE_BUS_ID = { '38': 'bus_001', '15-1': 'bus_002' };
const BUS_ROUTE_COLORS = {
  bus_001: '#0891b2', // cyan/teal
  bus_002: '#7c3aed', // violet
};
const DEFAULT_ROUTE_COLOR = '#0891b2';

function routeColorForLine(lineId) {
  return BUS_ROUTE_COLORS[LINE_BUS_ID[lineId]] || DEFAULT_ROUTE_COLOR;
}

function drawRoute({ coordinates, stops, stop_names }, lineId) {
  ROUTE_STOPS = stops;
  STOP_NAMES  = stop_names || [];

  // Remove the previous line's polyline/stop markers — drawRoute runs again
  // every time the line dropdown changes, and layers don't self-replace.
  if (routeOutline) map.removeLayer(routeOutline);
  if (routeLayer) map.removeLayer(routeLayer);
  stopMarkers.forEach(m => map.removeLayer(m));
  stopMarkers = [];
  activeStopIndex = null;

  // One continuous, solid track: a wide dark outline underneath (so the
  // route reads clearly over the light OSM tiles regardless of what's
  // under it) plus the bus's own color on top — no dashArray, no
  // per-segment polylines, just the full coordinate array in one line.
  routeOutline = L.polyline(coordinates, {
    color: '#1e293b', weight: 7, opacity: 0.35, lineJoin: 'round', lineCap: 'round',
  }).addTo(map);
  routeLayer = L.polyline(coordinates, {
    color: routeColorForLine(lineId), weight: 4, opacity: 1, lineJoin: 'round', lineCap: 'round',
  }).addTo(map);

  stops.forEach((coords, i) => {
    const marker = L.marker(coords, { icon: makeStopIcon(false) }).addTo(map);
    // Hover tooltip (not a click-required popup) shows the stop name.
    // Bound with empty content and filled in on open (rather than baked in
    // now) so it always reflects the current language even after a switch.
    marker.bindTooltip('', { permanent: false, direction: 'top', offset: [0, -12], className: 'stop-tooltip' });
    marker.on('tooltipopen', () => {
      marker.setTooltipContent(stopOptionLabel(i));
    });
    stopMarkers.push(marker);
  });
  // Reset the 3 selectors to this line's defaults *before* painting rings
  // from them — a stop index from the previous line points at a different
  // physical stop here, so preserving it would ring the wrong marker.
  populateStopSelects(false);
  refreshAllStopIcons();
  resetTripResults();
  console.log(`✓ Route drawn: ${coordinates.length} pts, ${stops.length} stops`);
}

// Clears any ETA/duration shown from a calculation made on the previous
// line — those minutes/stop names don't carry over and switching lines
// should never leave a stale result on screen.
function resetTripResults() {
  document.getElementById('my-stop-result').style.display = 'none';
  document.getElementById('my-stop-error').style.display  = 'none';
  document.getElementById('trip-result').style.display    = 'none';
  document.getElementById('trip-error').style.display     = 'none';
  myStopWidgetLive = false; // a stop index from the previous line means nothing here
}

function stopOptionLabel(i) {
  // Street name only — no "Parada N" prefix, except as a fallback for the
  // rare stop with no geocoded street name.
  const street = STOP_NAMES[i];
  return street || `${I18N[currentLang].stopLabel} ${i + 1}`;
}

function populateStopSelects(preserveSelection = true) {
  const originSel = document.getElementById('trip-origin');
  const destSel    = document.getElementById('trip-destination');
  const myStopSel  = document.getElementById('my-stop-select');
  if (!ROUTE_STOPS.length || !originSel || !destSel || !myStopSel) return;

  // preserveSelection=false on a line switch — a stop index selected on
  // the previous line points at a different physical stop on this one, so
  // restoring it would silently show the wrong place instead of resetting.
  const prevOrigin = preserveSelection ? originSel.value : '';
  const prevDest   = preserveSelection ? destSel.value   : '';
  const prevMyStop = preserveSelection ? myStopSel.value : '';

  [originSel, destSel, myStopSel].forEach(sel => { sel.innerHTML = ''; });
  ROUTE_STOPS.forEach((_, i) => {
    const text = stopOptionLabel(i);
    const opt1 = document.createElement('option');
    opt1.value = i; opt1.textContent = text;
    originSel.appendChild(opt1);
    const opt2 = document.createElement('option');
    opt2.value = i; opt2.textContent = text;
    destSel.appendChild(opt2);
    const opt3 = document.createElement('option');
    opt3.value = i; opt3.textContent = text;
    myStopSel.appendChild(opt3);
  });

  if (prevOrigin !== '') originSel.value = prevOrigin;
  if (prevDest !== '') { destSel.value = prevDest; }
  else destSel.selectedIndex = ROUTE_STOPS.length - 1;
  if (prevMyStop !== '') myStopSel.value = prevMyStop;
}

// ── "use my location" → pick nearest stop ───────────────────────────────────
function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dphi = toRad(lat2 - lat1);
  const dlambda = toRad(lon2 - lon1);
  const a = Math.sin(dphi / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dlambda / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

// Highlight the corresponding map marker the instant a stop selector
// changes — same rebuildStopIcon()/selectionStateFor() path drawRoute()
// and setActiveStop() already use, so rings never fall out of sync.
// Touching either selector group also makes it the ACTIVE one, clearing
// the other group's ring so the two never show at the same time.
[
  ['my-stop-select', 'myStop'],
  ['trip-origin', 'tripPlanner'],
  ['trip-destination', 'tripPlanner'],
].forEach(([id, group]) => {
  document.getElementById(id).addEventListener('change', () => {
    activeSelectionGroup = group;
    refreshAllStopIcons();
  });
});

document.getElementById('use-location-btn').addEventListener('click', () => {
  const errorBox = document.getElementById('my-stop-error');
  errorBox.style.display = 'none';

  if (!navigator.geolocation) {
    setDynamicMessage(errorBox, 'locationUnsupported');
    errorBox.style.display = 'block';
    return;
  }
  if (!ROUTE_STOPS.length) return;

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      let bestIdx = 0, bestDist = Infinity;
      ROUTE_STOPS.forEach(([slat, slon], i) => {
        const d = haversineMeters(latitude, longitude, slat, slon);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      });
      document.getElementById('my-stop-select').value = bestIdx;
      activeSelectionGroup = 'myStop';
      refreshAllStopIcons(); // setting .value programmatically doesn't fire 'change'
      setMyLocationMarker(latitude, longitude);
      map.fitBounds([[latitude, longitude], ROUTE_STOPS[bestIdx]], { padding: [60, 60], animate: false });
      // Otherwise the next live bus update — if it's still the first one
      // this page load has seen — immediately re-centers the map on the
      // bus via setBusPosition()'s own firstMove logic, snapping the view
      // away right after fitBounds set it deliberately.
      firstMove = false;
      errorBox.style.color   = 'var(--accent)';
      setDynamicMessage(errorBox, 'locationSet');
      errorBox.style.display = 'block';
    },
    (err) => {
      console.warn('Geolocation error:', err);
      errorBox.style.color   = 'var(--very_high)';
      setDynamicMessage(errorBox, err.code === err.PERMISSION_DENIED ? 'locationDenied' : 'locationError');
      errorBox.style.display = 'block';
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

// ── quick "when does my bus arrive?" check (single stop) ───────────────────
// Extracted so the same check can run both on the button click AND
// silently on every WS tick for the selected bus (see ws.onmessage) —
// mirrors how the sidebar's ETA already updates live, instead of only
// ever reflecting the instant the button was pressed.
let myStopWidgetLive = false; // true once the user has checked at least once for the current stop/line

async function checkMyStopArrival({ recenter = false, clearFirst = false } = {}) {
  const stopId    = parseInt(document.getElementById('my-stop-select').value, 10);
  const errorBox  = document.getElementById('my-stop-error');
  const resultBox = document.getElementById('my-stop-result');

  if (clearFirst) {
    errorBox.style.display  = 'none';
    resultBox.style.display = 'none';
  }

  try {
    const res = await fetch(TRIP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ origin_stop_id: stopId, destination_stop_id: stopId, route_id: selectedLine, bus_id: selectedBus }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();

    if (d.bus_already_passed) {
      // eta_to_origin_min is 0 here — "arrives in 0s / at 10:12am" reads as
      // real data but is meaningless once the bus already went by, so show
      // only the "already passed" notice instead of both.
      resultBox.style.display = 'none';
      errorBox.style.color    = 'var(--medium)';
      setDynamicMessage(errorBox, 'busAlreadyPassed');
      errorBox.style.display  = 'block';
    } else {
      document.getElementById('my-stop-eta').textContent = formatDuration(d.eta_to_origin_min);
      // Build the arrival clock time from THIS device's own "now" plus the
      // (timezone-agnostic) minutes the backend returned, instead of parsing
      // d.total_arrival_time — that's an absolute timestamp computed from the
      // server's clock (UTC on Render) with no timezone suffix, so browsers
      // read it as their OWN local time and show a value hours off from
      // reality (e.g. "02:48 a.m." when it's actually ~10pm locally).
      const arrivalMs = Date.now() + (d.eta_to_origin_min + d.trip_duration_min) * 60000;
      document.getElementById('my-stop-arrival').textContent =
        new Date(arrivalMs).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      resultBox.style.display = 'block';
      errorBox.style.display  = 'none';
    }

    if (recenter && ROUTE_STOPS[stopId]) map.setView(ROUTE_STOPS[stopId], 16, { animate: false });
  } catch (err) {
    console.error('My-stop ETA error:', err);
    resultBox.style.display = 'none';
    errorBox.style.color    = 'var(--very_high)';
    setDynamicMessage(errorBox, 'myStopErrorGeneric');
    errorBox.style.display  = 'block';
  }
}

document.getElementById('my-stop-btn').addEventListener('click', () => {
  myStopWidgetLive = true;
  checkMyStopArrival({ recenter: true, clearFirst: true });
});

// ── trip planner ─────────────────────────────────────────────────────────
document.getElementById('trip-calc-btn').addEventListener('click', async () => {
  const origin      = parseInt(document.getElementById('trip-origin').value, 10);
  const destination = parseInt(document.getElementById('trip-destination').value, 10);
  const errorBox    = document.getElementById('trip-error');
  const resultBox   = document.getElementById('trip-result');

  errorBox.style.color    = 'var(--very_high)';
  errorBox.style.display  = 'none';
  resultBox.style.display = 'none';

  if (destination < origin) {
    setDynamicMessage(errorBox, 'tripErrorRange');
    errorBox.style.display = 'block';
    return;
  }

  try {
    const res = await fetch(TRIP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ origin_stop_id: origin, destination_stop_id: destination, route_id: selectedLine, bus_id: selectedBus }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();

    document.getElementById('trip-duration').textContent = formatDuration(d.trip_duration_min);
    resultBox.style.display = 'block';

    if (ROUTE_STOPS[origin] && ROUTE_STOPS[destination]) {
      if (origin === destination) {
        map.setView(ROUTE_STOPS[origin], 16, { animate: false });
      } else {
        map.fitBounds([ROUTE_STOPS[origin], ROUTE_STOPS[destination]], { padding: [60, 60], animate: false });
      }
    }

    if (d.bus_already_passed) {
      errorBox.style.color   = 'var(--medium)';
      setDynamicMessage(errorBox, 'busAlreadyPassed');
      errorBox.style.display = 'block';
    }
  } catch (err) {
    console.error('Trip planner error:', err);
    errorBox.style.color   = 'var(--very_high)';
    setDynamicMessage(errorBox, 'tripErrorGeneric');
    errorBox.style.display = 'block';
  }
});

function loadRoute(lineId, attempt = 1) {
  fetch(window.location.origin + '/route?line=' + encodeURIComponent(lineId))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => drawRoute(data, lineId))
    .catch(err => {
      console.error(`Route fetch failed (attempt ${attempt}):`, err);
      if (attempt < 5) setTimeout(() => loadRoute(lineId, attempt + 1), 2000 * attempt);
    });
}

// ── line picker ──────────────────────────────────────────────────────────
let selectedLine = '38';
let busStateByBus = {};  // last known PredictionResponse per bus_id, ANY bus
let selectedBus   = LINE_BUS_ID[selectedLine]; // which bus's data the WHOLE
                                                // sidebar (ETA, next stop,
                                                // occupancy) currently shows —
                                                // click a bus on the map to change it

function switchLine(lineId) {
  selectedLine = lineId;
  loadRoute(lineId);
  activeSelectionGroup = null; // neither selector has been touched for this line yet

  // Clear every bus marker from the previous line first — they get rebuilt
  // below from whatever's cached for the new one, if anything.
  Object.values(busMarkers).forEach(m => map.removeLayer(m));
  busMarkers = {};
  lastBusIconKey = {};
  firstMove = true;

  // Default back to this line's primary bus; selectBus() itself renders the
  // sidebar/occupancy/active-stop from cache, or resets them if there's none.
  selectBus(LINE_BUS_ID[lineId], { skipMarkerRefresh: true });
  if (!busStateByBus[selectedBus]) setNoDataVisible(true);

  // Rebuild a marker for every bus already known for this line (not just
  // the selected one) — e.g. switched away and back after both started sending.
  Object.values(busStateByBus).forEach(b => {
    if (b.route_id === lineId) setBusPosition(b.bus_id, b.lat, b.lon, b.occupancy_class);
  });
}

function resetSidebar() {
  document.getElementById('s-eta').textContent       = '—';
  document.getElementById('s-next-stop').textContent = '—';
}

// Click a bus's marker on the map to make it the one the whole sidebar
// (ETA, next stop, OCUPACIÓN) reflects, and the one the trip planner /
// "¿cuándo llega mi bus?" compute against — no dropdown, the map IS the picker.
function selectBus(busId, { skipMarkerRefresh = false } = {}) {
  selectedBus = busId;
  document.getElementById('s-selected-bus').textContent = 'Bus ' + busId.replace('bus_', '');

  const cached = busStateByBus[busId];
  if (cached) {
    updateSidebar(cached);
    updateActiveStopMarker(cached.lat, cached.lon);
  } else {
    resetSidebar();
  }
  // Show occupancy right on the map immediately (best data available so
  // far), on top of the sidebar update above — on a phone the sidebar is a
  // full overlay that hides the buses it's describing, so tapping a bus
  // needs its own answer that doesn't require opening the sidebar.
  updateBusPopupContent(busId, cached ? cached.occupancy_class : null, cached ? cached.occupancy_pct : 0);
  if (busMarkers[busId]) busMarkers[busId].openPopup();
  refreshOccupancyForBus(busId); // then refines it with the viewer's local time
  if (!skipMarkerRefresh) refreshBusMarkerEmphasis();
}

// ── OCUPACIÓN block: driven by whichever bus is currently selected
// (see selectBus()) — same bus the ETA/next-stop fields above follow. ────
const OCC_LABEL_KEY = { low: 'occLow', medium: 'occMedium', high: 'occHigh', very_high: 'occVeryHigh' };
// How many of the 3 little-person icons are "filled in" (colored) per
// occupancy level — high and very_high both fill all 3, just in a
// different color (see OCC_COLORS), since there's no 4th icon to spare.
const OCC_FILLED_COUNT = { low: 1, medium: 2, high: 3, very_high: 3 };

function updateOccupancyBlock(d) {
  const pct   = d.occupancy_pct ?? 0;
  const cls   = d.occupancy_class ?? 'low';
  const color = OCC_COLORS[cls] || '#22c55e';
  const fill  = document.getElementById('s-occ-fill');
  fill.style.width      = pct + '%';
  fill.style.background = color;
  document.getElementById('s-occ-pct').textContent = pct.toFixed(0) + '%';
  const badge = document.getElementById('s-occ-badge');
  setDynamicMessage(badge, OCC_LABEL_KEY[cls] || 'occLow');
  badge.style.background = color;
  // Keep the map popup (see selectBus()) in sync with this more accurate,
  // viewer-local-time recomputed value.
  updateBusPopupContent(selectedBus, cls, pct);
}

function resetOccupancyBlock() {
  document.getElementById('s-occ-fill').style.width      = '0%';
  document.getElementById('s-occ-fill').style.background = '';
  document.getElementById('s-occ-pct').textContent       = '0%';
  const badge = document.getElementById('s-occ-badge');
  badge.textContent      = '—';
  badge.style.background = '';
  updateBusPopupContent(selectedBus, null, 0);
}

// Fills a bus marker's map popup with its occupancy — the "away from the
// sidebar" answer to OCUPACIÓN, shown the instant a bus is tapped (see
// selectBus()) and kept fresh by updateOccupancyBlock()/resetOccupancyBlock().
// Solid "person" silhouette as inline SVG rather than an actual 🧑 emoji —
// emoji are pre-colored glyphs (their own color font), so CSS `fill`/`color`
// can't tint them per occupancy level; an SVG path can be colored exactly.
const PERSON_SVG_PATH = 'M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512l388.6 0c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304l-91.4 0z';

function personIconsHtml(occClass) {
  const filled = OCC_FILLED_COUNT[occClass] || 0;
  const color  = OCC_COLORS[occClass] || '#22c55e';
  let html = '';
  for (let i = 0; i < 3; i++) {
    const fill = i < filled ? color : 'var(--border)';
    html += `<svg class="bus-popup-person" viewBox="0 0 448 512" width="14" height="14" style="fill:${fill}"><path d="${PERSON_SVG_PATH}"/></svg>`;
  }
  return html;
}

function updateBusPopupContent(busId, occClass, pct) {
  const marker = busMarkers[busId];
  if (!marker) return;
  const hasData = occClass != null;
  const color   = hasData ? (OCC_COLORS[occClass] || '#22c55e') : 'var(--border)';
  const label   = hasData ? I18N[currentLang][OCC_LABEL_KEY[occClass] || 'occLow'] : '—';
  marker.setPopupContent(
    `<div class="bus-popup-title">Bus ${busId.replace('bus_', '')}</div>
     <div class="bus-popup-badge" style="background:${color}">${label}</div>
     <div class="bus-popup-people">${personIconsHtml(occClass)}</div>
     ${hasData ? `<div class="bus-popup-pct">${pct.toFixed(0)}%</div>` : ''}`
  );
}

// The occupancy model's hour/day/is_rush_hour normally come from whichever
// machine happens to be running the simulator — unrelated to whoever is
// looking at the dashboard. Send THIS device's clock instead so OCUPACIÓN
// reflects "now" for the viewer, not for wherever simulator.py runs.
function viewerTimeFeatures() {
  const now = new Date();
  const hour = now.getHours();
  const dayOfWeek = (now.getDay() + 6) % 7; // JS: Sun=0..Sat=6 -> Mon=0..Sun=6 (matches the backend/simulator convention)
  const isRushHour = (hour >= 7 && hour <= 9) || (hour >= 18 && hour <= 20) ? 1 : 0;
  return { hour, day_of_week: dayOfWeek, is_rush_hour: isRushHour };
}

// Re-runs the occupancy prediction for `busId` using this device's clock
// instead of the raw WS payload's (simulator-clock) values, and renders
// whatever comes back. Falls back to the raw telemetry's own occupancy if
// the request fails (offline, bus has no telemetry yet, etc.) so the block
// still shows something rather than going blank.
async function refreshOccupancyForBus(busId) {
  const fallback = () => {
    const cached = busStateByBus[busId];
    if (cached) updateOccupancyBlock(cached);
    else resetOccupancyBlock();
  };
  try {
    const res = await fetch(window.location.origin + '/predict/occupancy/for-viewer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bus_id: busId, ...viewerTimeFeatures() }),
    });
    if (busId !== selectedBus) return; // selection changed while this was in flight
    if (!res.ok) { fallback(); return; }
    updateOccupancyBlock(await res.json());
  } catch (e) {
    if (busId === selectedBus) fallback();
  }
}

// No dropdown to populate anymore — see selectBus(), wired to each bus
// marker's click handler in setBusPosition() below.

function populateLineSelect() {
  fetch(window.location.origin + '/route/lines')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(lines => {
      const sel = document.getElementById('line-select');
      sel.innerHTML = '';
      lines.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.route_id;
        opt.textContent = l.label;
        sel.appendChild(opt);
      });
      if (lines.length) {
        selectedLine = lines[0].route_id;
        sel.value = selectedLine;
      }
      switchLine(selectedLine);
    })
    .catch(err => {
      console.error('Failed to load line list, defaulting to 38:', err);
      switchLine(selectedLine);
    });
}

document.getElementById('line-select').addEventListener('change', (e) => {
  switchLine(e.target.value);
});

populateLineSelect();


// ── bus marker ───────────────────────────────────────────────────────────
// Each bus keeps a fixed identity color (border/glow) regardless of line
// switching, distinct from occupancy (the dot's fill) so both pieces of
// information stay visible at once. Primary buses reuse their line's own
// route-track color (bus_001/bus_002) for visual consistency; the second,
// staggered-start bus on each line gets its own new color.
const BUS_ACCENT = {
  bus_001: { color: '#0891b2', pulse: 'busPulseCyan' },
  bus_003: { color: '#84cc16', pulse: 'busPulseLime' },
  bus_002: { color: '#7c3aed', pulse: 'busPulseViolet' },
  bus_004: { color: '#db2777', pulse: 'busPulsePink' },
};

function makeBusIcon(occColor, busId, isSelected) {
  const accent = BUS_ACCENT[busId] || { color: '#c2410c', pulse: 'busPulseCyan' };
  // Enlarged from 26/34 — the bus is the map's main subject, everything
  // else (stops, rings, labels) should read as secondary to it.
  const size = isSelected ? 46 : 36;
  const fontSize = isSelected ? 25 : 19;
  return L.divIcon({
    className: '',
    html: `
      <div class="bus-marker-wrap">
        <div class="bus-dot${isSelected ? ' selected' : ''}"
             style="width:${size}px;height:${size}px;font-size:${fontSize}px;
                    background:${occColor}; border-color:${accent.color};
                    animation-name:${accent.pulse};">🚌</div>
      </div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
  });
}

// ── "my location" marker ──────────────────────────────────────────────────
// Icon is a function (not a static constant) so applyI18n() can regenerate
// it — "Estás aquí"/"You are here" needs to retranslate on a language switch
// the same as everything else, without waiting for the marker to move.
// The label itself is a one-time callout, not a permanent map annotation —
// it fades after MY_LOCATION_LABEL_MS regardless of what the user does next
// (myLocationLabelShown drives whether makeMyLocationIcon() renders it).
const MY_LOCATION_LABEL_MS = 4000;
let myLocationLabelShown = false;
let myLocationLabelTimer = null;

function makeMyLocationIcon() {
  return L.divIcon({
    className: '',
    html: `
      <div class="my-location-wrap" style="width:16px;height:16px;">
        <div class="my-location-dot"></div>
        ${myLocationLabelShown ? `<div class="map-label map-label-here">${I18N[currentLang].youAreHere}</div>` : ''}
      </div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10],
  });
}

let myLocationMarker = null;

function setMyLocationMarker(lat, lon) {
  myLocationLabelShown = true;
  if (!myLocationMarker) {
    myLocationMarker = L.marker([lat, lon], { icon: makeMyLocationIcon(), zIndexOffset: 500 })
      .addTo(map)
      .bindPopup(`<b style="font-family:monospace">📍 ${I18N[currentLang].youAreHere}</b>`);
  } else {
    myLocationMarker.setLatLng([lat, lon]);
    myLocationMarker.setIcon(makeMyLocationIcon());
  }
  clearTimeout(myLocationLabelTimer);
  myLocationLabelTimer = setTimeout(() => {
    myLocationLabelShown = false;
    if (myLocationMarker) myLocationMarker.setIcon(makeMyLocationIcon());
  }, MY_LOCATION_LABEL_MS);
}

let busMarkers    = {}; // one Leaflet marker per bus_id currently shown on the map
let lastBusIconKey = {}; // per bus_id, so the icon DOM is only rebuilt when something visible actually changed
let firstMove = true;

const OCC_COLORS = {
  low:       '#22c55e',
  medium:    '#f59e0b',
  high:      '#f97316',
  very_high: '#ef4444',
};

function setNoDataVisible(visible) {
  document.getElementById('no-data').style.display = visible ? '' : 'none';
}

// Renders/moves ONE bus's marker. Called for every bus of the currently
// selected line (not just the primary) so both buses show up on the map
// at once, each in its own BUS_ACCENT color; whichever is picked in
// the currently selected bus (click a marker) is drawn larger with a stronger pulse (see makeBusIcon).
function setBusPosition(busId, lat, lon, occClass) {
  setNoDataVisible(false); // showing a marker and the "no data" hint must never both be true
  const occColor    = OCC_COLORS[occClass] || '#c2410c';
  const isSelected  = busId === selectedBus;
  const iconKey     = occColor + '|' + isSelected;

  if (!busMarkers[busId]) {
    busMarkers[busId] = L.marker([lat, lon], { icon: makeBusIcon(occColor, busId, isSelected) })
      .addTo(map)
      .bindPopup('', { closeButton: false, className: 'bus-popup', offset: [0, -14] })
      .on('click', () => selectBus(busId));
    lastBusIconKey[busId] = iconKey;
  } else {
    busMarkers[busId].setLatLng([lat, lon]);
    // Only rebuild the icon's DOM when something visible actually changed —
    // recreating it on every tick caused the marker to flicker/disappear.
    if (lastBusIconKey[busId] !== iconKey) {
      busMarkers[busId].setIcon(makeBusIcon(occColor, busId, isSelected));
      lastBusIconKey[busId] = iconKey;
    }
  }
  if (firstMove) {
    map.setView([lat, lon], 15);
    firstMove = false;
  }
}

// Re-applies the "selected" emphasis (bigger + stronger pulse) to whichever
// bus is currently selected — called when that selection
// changes, using each bus's own last known occupancy color rather than
// waiting for its next tick to visually update.
function refreshBusMarkerEmphasis() {
  Object.keys(busMarkers).forEach(busId => {
    const state    = busStateByBus[busId];
    const occColor = OCC_COLORS[state?.occupancy_class] || '#c2410c';
    const isSelected = busId === selectedBus;
    busMarkers[busId].setIcon(makeBusIcon(occColor, busId, isSelected));
    lastBusIconKey[busId] = occColor + '|' + isSelected;
  });
}

// Highlights whichever stop marker is geographically closest to the bus
// right now (the "próxima parada" shown in the sidebar) — swaps just the
// two affected icons instead of rebuilding all 21 markers on every tick.
function setActiveStop(idx) {
  if (idx === activeStopIndex) return;
  const prevIdx = activeStopIndex;
  activeStopIndex = idx;
  // Rebuild through rebuildStopIcon() (not a bare makeStopIcon(..., false))
  // so any selection rings already on these two stops survive the swap.
  if (prevIdx !== null) rebuildStopIcon(prevIdx);
  rebuildStopIcon(idx);
}

function updateActiveStopMarker(lat, lon) {
  const n = ROUTE_STOPS.length;
  if (!n) return;

  if (activeStopIndex === null) {
    // No baseline yet (line just loaded) — do one global nearest-of-all
    // search to find a starting point.
    let nearestIdx = 0, nearestDist = Infinity;
    ROUTE_STOPS.forEach(([slat, slon], i) => {
      const d = haversineMeters(lat, lon, slat, slon);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    });
    setActiveStop(nearestIdx);
    return;
  }

  // After that, only compare against the current stop and its immediate
  // neighbors (previous/next), never all 21. Real streets curve, so a
  // straight-line "nearest of all" search can briefly find an already-
  // passed stop closer than the one actually ahead and jump the highlight
  // backward — restricting the candidates to adjacent stops means it can
  // only ever step one stop forward or back, matching how the bus is
  // actually moving along the route.
  const candidates = [activeStopIndex, (activeStopIndex + 1) % n, (activeStopIndex - 1 + n) % n];
  let bestIdx = activeStopIndex;
  let bestDist = haversineMeters(lat, lon, ROUTE_STOPS[activeStopIndex][0], ROUTE_STOPS[activeStopIndex][1]);
  candidates.forEach(i => {
    const [slat, slon] = ROUTE_STOPS[i];
    const d = haversineMeters(lat, lon, slat, slon);
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  });
  setActiveStop(bestIdx);
}

// ── sidebar update ───────────────────────────────────────────────────────
function updateSidebar(d) {
  setNoDataVisible(false);
  document.getElementById('s-eta').textContent       = formatDuration(d.eta_minutes);
  document.getElementById('s-next-stop').textContent = d.next_stop || '—';
  // OCUPACIÓN is intentionally not touched here — see updateOccupancyBlock(),
  // which follows whichever bus is currently selected (see selectBus()) instead of always
  // the line's primary bus.
}

// ── WebSocket connection ─────────────────────────────────────────────────
let ws;

function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    document.getElementById('conn-dot').classList.add('live');
    document.getElementById('conn-label').textContent = I18N[currentLang].connectingLive;
  };

  ws.onmessage = (evt) => {
    try {
      const d = JSON.parse(evt.data);
      busStateByBus[d.bus_id] = d;

      if (d.route_id !== selectedLine) return; // a different line's bus — not shown here at all

      // Every bus of the current line gets its own marker on the map...
      setBusPosition(d.bus_id, d.lat, d.lon, d.occupancy_class);

      // ...but the whole sidebar (ETA, next stop, OCUPACIÓN) only follows
      // whichever bus is currently selected — click a bus on the map to
      // change which one that is (see selectBus()).
      if (d.bus_id === selectedBus) {
        updateSidebar(d);
        updateActiveStopMarker(d.lat, d.lon);
        refreshOccupancyForBus(d.bus_id);
        // Keeps "¿Cuándo llega mi bus?" live the same way the sidebar ETA
        // already is, instead of only ever reflecting the moment "Ver
        // llegada" was clicked.
        if (myStopWidgetLive) checkMyStopArrival();
      }
    } catch (e) { console.warn('parse error', e); }
  };

  ws.onclose = () => {
    document.getElementById('conn-dot').classList.remove('live');
    document.getElementById('conn-label').textContent = I18N[currentLang].disconnectedRetry;
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => ws.close();
}

applyI18n();
connectWS();

// ── also poll /predict/eta/broadcast for direct HTTP demo ────────────────
// (useful if WS isn't used yet — the simulator can just POST to /predict/eta/broadcast)
</script>
</body>
</html>
