<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Prediction Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:       #eef1f5;
    --surface:  #ffffff;
    --border:   #dde1e7;
    --text:     #14181f;
    --muted:    #667085;
    --accent:   #c2410c;
    --low:      #22c55e;
    --medium:   #f59e0b;
    --high:     #f97316;
    --very_high:#ef4444;
    --mono: 'Space Grotesk', sans-serif;
    --sans: 'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 320px 1fr;
    transition: grid-template-columns .25s ease;
  }
  body.sidebar-collapsed { grid-template-columns: 0px 1fr; }

  #sidebar-toggle {
    position: fixed;
    top: 78px;
    left: 320px;
    transform: translateX(-50%);
    z-index: 1000;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    line-height: 1;
    transition: left .25s ease;
  }
  #sidebar-toggle:hover { color: var(--accent); border-color: var(--accent); }
  body.sidebar-collapsed #sidebar-toggle { left: 12px; }

  /* ── header ── */
  header {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .08em;
    color: var(--accent);
  }
  .logo span { color: var(--muted); }
  #conn-status {
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
  }
  #conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background .3s;
  }
  #conn-dot.live { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  /* ── sidebar ── */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 16px 16px 8px;
    border-bottom: 1px solid var(--border);
  }

  /* active bus card */
  #bus-card {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  #bus-card #line-select {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    width: 100%;
    margin-bottom: 16px;
    cursor: pointer;
  }
  #bus-card #line-select:hover { border-color: var(--accent); }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
  }
  .stat-unit {
    font-size: 12px;
    color: var(--muted);
    margin-left: 2px;
  }

  /* occupancy bar */
  .occ-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .occ-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .occ-title { font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: .06em; }
  .occ-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--low);
    color: #000;
    text-transform: uppercase;
    font-weight: 700;
  }
  .occ-track {
    background: var(--bg);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .occ-fill {
    height: 100%;
    border-radius: 4px;
    transition: width .6s ease, background .4s ease;
    background: var(--low);
  }
  .occ-pct {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  /* ── map ── */
  #map {
    width: 100%;
    height: 100%;
    background: var(--bg);
  }
  .leaflet-container { background: var(--bg); }

  /* bus marker */
  .bus-marker-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bus-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 4px rgba(194,65,12,.25), 0 0 12px rgba(194,65,12,.4);
    animation: pulse 2s infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(194,65,12,.25), 0 0 12px rgba(194,65,12,.4); }
    50% { box-shadow: 0 0 0 8px rgba(194,65,12,.1), 0 0 20px rgba(194,65,12,.3); }
  }

  /* user location marker */
  .my-location-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    border: 2px solid #fff;
    box-shadow: 0 0 0 4px rgba(59,130,246,.3), 0 0 10px rgba(59,130,246,.5);
  }

  /* numbered stop markers */
  .stop-marker-wrap { position: relative; }
  .stop-pulse {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border-radius: 50%;
    animation-timing-function: ease-out;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
    pointer-events: none;
  }
  .stop-dot {
    position: relative;
    z-index: 2;
    border-radius: 50%;
    color: #fff;
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  @keyframes stopPulse {
    0%   { transform: scale(1);   opacity: .55; }
    70%  { transform: scale(2.1); opacity: 0; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  @keyframes stopPulseActive {
    0%   { transform: scale(1);   opacity: .8; }
    60%  { transform: scale(2.5); opacity: 0; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  /* Selection rings — one per selector (my-stop / origin / destination) so
     picking the same stop in more than one selector shows as concentric
     rings instead of one style overwriting another. */
  .stop-select-ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    border: 3px solid;
    box-sizing: border-box;
    pointer-events: none;
  }

  /* hover tooltip for stop markers */
  .stop-tooltip {
    background: rgba(20,24,31,.92);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 9px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .leaflet-tooltip-top.stop-tooltip::before {
    border-top-color: rgba(20,24,31,.92); /* recolor Leaflet's built-in arrow, don't hide it */
  }

  /* ── no data state ── */
  #no-data {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--muted);
    pointer-events: none;
    z-index: 999;
  }
  #no-data .big { font-size: 32px; margin-bottom: 8px; }
  #no-data p { font-size: 13px; font-family: var(--mono); }

  /* ── trip planner / my-stop widget ── */
  #trip-section, #my-stop-widget { padding: 16px; border-bottom: 1px solid var(--border); }
  .trip-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  #trip-section select, #my-stop-widget select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 13px;
    width: 100%;
    min-width: 0;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  #trip-calc-btn, #my-stop-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 10px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
  }
  #trip-calc-btn:hover, #my-stop-btn:hover { opacity: .85; }
  #trip-result, #my-stop-result {
    margin-top: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    display: none;
  }
  #trip-result .trip-line, #my-stop-result .trip-line { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #trip-result .trip-line:last-child, #my-stop-result .trip-line:last-child { margin-bottom: 0; }
  #trip-result .trip-label, #my-stop-result .trip-label { color: var(--muted); font-family: var(--mono); font-size: 10px; text-transform: uppercase; }
  #trip-result .trip-value, #my-stop-result .trip-value { font-weight: 600; }
  #trip-error, #my-stop-error { color: var(--very_high); font-size: 12px; margin-top: 8px; display: none; }

  /* ── language toggle ── */
  #lang-toggle {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
  }
  #lang-toggle:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo">BUS PREDICTION <span style="font-size:10px;margin-left:8px;opacity:.5">v1.0</span></div>
  <div style="display:flex; align-items:center; gap:14px;">
    <div id="conn-status">
      <div id="conn-dot"></div>
      <span id="conn-label" data-i18n="waitingData">esperando datos…</span>
    </div>
    <button id="lang-toggle" title="Cambiar idioma / Switch language">EN</button>
  </div>
</header>

<button id="sidebar-toggle" title="Ocultar/mostrar panel · Hide/show panel">‹</button>

<!-- sidebar -->
<aside>
  <div class="section-label" data-i18n="activeBus">Active Bus</div>

  <div id="bus-card">
    <select id="line-select" title="Elegir línea / Choose line"></select>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label" data-i18n="eta">ETA</div>
        <div class="stat-value" id="s-eta">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label" data-i18n="nextStop">Next stop</div>
        <div class="stat-value" id="s-next-stop" style="font-size:13px;">—</div>
      </div>
    </div>
  </div>

  <div class="occ-section">
    <div class="occ-header">
      <span class="occ-title" data-i18n="occupancy">OCCUPANCY</span>
      <span class="occ-badge" id="s-occ-badge">—</span>
    </div>
    <div class="occ-track"><div class="occ-fill" id="s-occ-fill" style="width:0%"></div></div>
    <div class="occ-pct" id="s-occ-pct">0%</div>
  </div>

  <div class="section-label" data-i18n="myStopSection">When does my bus arrive?</div>
  <div id="my-stop-widget" style="padding:16px; border-bottom:1px solid var(--border);">
    <div class="trip-row">
      <div style="display:flex; gap:8px; min-width:0;">
        <select id="my-stop-select" style="flex:1; min-width:0;"></select>
        <button id="use-location-btn" title="" style="flex-shrink:0; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:0 12px; cursor:pointer; font-size:15px;">📍</button>
      </div>
      <button id="my-stop-btn" data-i18n="checkEta">Check arrival</button>
    </div>
    <div id="my-stop-error" style="color:var(--very_high); font-size:12px; margin-top:4px; display:none;"></div>
    <div id="my-stop-result" style="margin-top:10px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:12px; display:none;">
      <div class="trip-line">
        <span class="trip-label" data-i18n="etaToOrigin">ETA to origin</span>
        <span class="trip-value" id="my-stop-eta">—</span>
      </div>
      <div class="trip-line">
        <span class="trip-label" data-i18n="arrivalTime">Arrival time</span>
        <span class="trip-value" id="my-stop-arrival">—</span>
      </div>
    </div>
  </div>

  <div class="section-label" data-i18n="tripPlanner">Plan a trip (A → B)</div>
  <div id="trip-section">
    <div class="trip-row">
      <select id="trip-origin"></select>
      <select id="trip-destination"></select>
      <button id="trip-calc-btn" data-i18n="calculate">Calculate</button>
    </div>
    <div id="trip-error" data-i18n-key="tripError"></div>
    <div id="trip-result">
      <div class="trip-line" style="margin-bottom:0;">
        <span class="trip-label" data-i18n="tripDuration">Trip duration</span>
        <span class="trip-value" id="trip-duration" style="font-size:18px;">—</span>
      </div>
    </div>
  </div>
</aside>

<!-- map -->
<div style="position:relative; overflow:hidden;">
  <div id="map"></div>
  <div id="no-data">
    <div class="big">🚌</div>
    <p data-i18n="noDataHint">Iniciá el simulator.py<br>para ver el bus en tiempo real</p>
  </div>
</div>

<script>
// ── config ──────────────────────────────────────────────────────────────
const WS_URL      = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
const PREDICT_URL = window.location.origin + '/predict/eta/broadcast';
const TRIP_URL     = window.location.origin + '/predict/trip';

// ── formatting helpers ──────────────────────────────────────────────────
// Renders a minutes value as seconds below 1 min, "Nmin" below 1h, and
// "Hh Nmin" beyond that, instead of raw fractional/triple-digit minutes.
function formatDuration(totalMinutes) {
  if (totalMinutes == null || isNaN(totalMinutes)) return '—';
  let totalSeconds = Math.round(totalMinutes * 60);
  const hours = Math.floor(totalSeconds / 3600);
  totalSeconds -= hours * 3600;
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds - minutes * 60;

  if (hours > 0) return minutes > 0 ? `${hours}h ${minutes}min` : `${hours}h`;
  if (minutes > 0) return `${minutes}min`;
  return `${seconds}s`;
}

// ── i18n ─────────────────────────────────────────────────────────────────
const I18N = {
  es: {
    waitingData: 'esperando datos…', connectingLive: 'Conectando · En vivo',
    disconnectedRetry: 'desconectado · reintentando…',
    activeBus: 'Bus Activo', eta: 'ETA', nextStop: 'Próxima Parada', occupancy: 'OCUPACIÓN',
    tripPlanner: 'Planificador de Viaje', calculate: 'Calcular',
    etaToOrigin: 'El bus llega en', tripDuration: 'Duración del viaje', arrivalTime: 'Hora estimada',
    noDataHint: 'Iniciá el simulator.py<br>para ver el bus en tiempo real',
    stopLabel: 'Parada', tripErrorRange: 'El destino no puede estar antes del origen.',
    myStopSection: '¿Cuándo llega mi bus?', checkEta: 'Ver llegada',
    myStopErrorGeneric: 'No se pudo calcular la llegada.',
    useLocationTitle: 'Usar mi ubicación para elegir la parada más cercana',
    locationUnsupported: 'Tu navegador no soporta geolocalización.',
    locationDenied: 'Permiso de ubicación denegado. Elegí tu parada manualmente.',
    locationError: 'No se pudo obtener tu ubicación.',
    locationSet: 'Parada más cercana seleccionada según tu ubicación.',
    tripErrorGeneric: 'No se pudo calcular el viaje.',
    busAlreadyPassed: '🚌 El bus ya pasó por esta parada.',
  },
  en: {
    waitingData: 'waiting for data…', connectingLive: 'Connecting · Live',
    disconnectedRetry: 'disconnected · retrying…',
    activeBus: 'Active Bus', eta: 'ETA', nextStop: 'Next Stop', occupancy: 'OCCUPANCY',
    tripPlanner: 'Trip Planner', calculate: 'Calculate',
    etaToOrigin: 'Bus arrives in', tripDuration: 'Trip duration', arrivalTime: 'Estimated time',
    noDataHint: 'Start simulator.py<br>to see the bus in real time',
    stopLabel: 'Stop', tripErrorRange: 'Destination cannot be before the origin.',
    myStopSection: 'When does my bus arrive?', checkEta: 'Check arrival',
    myStopErrorGeneric: 'Could not calculate the arrival.',
    useLocationTitle: 'Use my location to pick the nearest stop',
    locationUnsupported: 'Your browser does not support geolocation.',
    locationDenied: 'Location permission denied. Pick your stop manually.',
    locationError: 'Could not get your location.',
    locationSet: 'Nearest stop selected based on your location.',
    tripErrorGeneric: 'Could not calculate the trip.',
    busAlreadyPassed: '🚌 The bus already went past this stop.',
  },
};
let currentLang = 'es';

function applyI18n() {
  const dict = I18N[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) el.innerHTML = dict[key];
  });
  document.getElementById('lang-toggle').textContent = currentLang === 'es' ? 'EN' : 'ES';
  document.getElementById('use-location-btn').title = dict.useLocationTitle;
  populateStopSelects(); // refresh "Parada N" / "Stop N" option labels
}

document.getElementById('lang-toggle').addEventListener('click', () => {
  currentLang = currentLang === 'es' ? 'en' : 'es';
  applyI18n();
});

// ── map init ─────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false, attributionControl: false })
  .setView([-25.3115, -57.5432], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ── sidebar collapse ─────────────────────────────────────────────────────
const sidebarToggle = document.getElementById('sidebar-toggle');

function setSidebarCollapsed(collapsed) {
  document.body.classList.toggle('sidebar-collapsed', collapsed);
  sidebarToggle.textContent = collapsed ? '›' : '‹';
  try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {}
  // Let the CSS width transition finish before Leaflet re-measures its container.
  setTimeout(() => map.invalidateSize(), 260);
}

sidebarToggle.addEventListener('click', () => {
  setSidebarCollapsed(!document.body.classList.contains('sidebar-collapsed'));
});

try {
  if (localStorage.getItem('sidebarCollapsed') === '1') setSidebarCollapsed(true);
} catch (e) {}

// ── route: loaded from backend ──────────────────────────────────────────
// Stop marker colors: not orange/red (route accent + occupancy badges
// already live there) and not the "my location" marker's blue, so all
// three stay visually distinct on the map.
const STOP_COLOR        = '#6366f1'; // indigo — normal stops
const STOP_ACTIVE_COLOR = '#f59e0b'; // gold/amber — the bus's next stop

// Selector highlight rings — distinct from the route/bus/active-stop
// colors already in use, and distinct from each other so origin vs
// destination is obvious at a glance. Drawn as separate concentric rings
// (not a single overwritten color) so selecting the same stop in more
// than one dropdown at once shows as stacked rings instead of one
// selector's highlight silently replacing another's.
const SELECT_RING_COLORS = {
  myStop:      '#ec4899', // pink   — "¿Cuándo llega mi bus?"
  origin:      '#22c55e', // green  — trip planner origin
  destination: '#a855f7', // purple — trip planner destination
};

function makeStopIcon(isActive, selection = {}) {
  const size     = isActive ? 28 : 22;
  const color    = isActive ? STOP_ACTIVE_COLOR : STOP_COLOR;
  const anim     = isActive ? 'stopPulseActive' : 'stopPulse';
  const duration = isActive ? '1.3s' : '2.6s';

  const ringColors = ['myStop', 'origin', 'destination']
    .filter(key => selection[key])
    .map(key => SELECT_RING_COLORS[key]);
  const ringsHtml = ringColors.map((ringColor, i) => {
    const d = size + 12 + i * 9; // each extra ring sits a bit further out, concentric
    const off = d / 2;
    return `<div class="stop-select-ring" style="width:${d}px;height:${d}px;margin-top:-${off}px;margin-left:-${off}px;border-color:${ringColor};"></div>`;
  }).join('');

  return L.divIcon({
    className: '',
    html: `
      <div class="stop-marker-wrap" style="width:${size}px;height:${size}px;">
        ${ringsHtml}
        <div class="stop-pulse" style="background:${color}; animation-name:${anim}; animation-duration:${duration};"></div>
        <div class="stop-dot" style="width:${size}px;height:${size}px;background:${color};"></div>
      </div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
  });
}

function selectionStateFor(i) {
  const val = id => { const v = document.getElementById(id).value; return v === '' ? null : parseInt(v, 10); };
  return {
    myStop:      i === val('my-stop-select'),
    origin:      i === val('trip-origin'),
    destination: i === val('trip-destination'),
  };
}

function rebuildStopIcon(i) {
  if (!stopMarkers[i]) return;
  stopMarkers[i].setIcon(makeStopIcon(i === activeStopIndex, selectionStateFor(i)));
}

function refreshAllStopIcons() {
  stopMarkers.forEach((_, i) => rebuildStopIcon(i));
}

let ROUTE_STOPS = [];
let STOP_NAMES  = [];
let routeOutline = null;
let routeLayer   = null;
let stopMarkers  = [];
let activeStopIndex = null; // index of ROUTE_STOPS closest to the bus right now

// Each line runs exactly one bus (see raspberry-pi/simulator.py's LINES
// registry: "38" -> bus_001, "15-1" -> bus_002). Route track color is keyed
// by bus_id — not orange/red (--accent/--high/--very_high already use that
// range) and not blue (already used by the "my location" marker) — so two
// buses' tracks stay visually distinct from each other and from the rest
// of the UI, and adding a third bus later is just one more color entry.
const LINE_BUS_ID = { '38': 'bus_001', '15-1': 'bus_002' };
const BUS_ROUTE_COLORS = {
  bus_001: '#0891b2', // cyan/teal
  bus_002: '#7c3aed', // violet
};
const DEFAULT_ROUTE_COLOR = '#0891b2';

function routeColorForLine(lineId) {
  return BUS_ROUTE_COLORS[LINE_BUS_ID[lineId]] || DEFAULT_ROUTE_COLOR;
}

function drawRoute({ coordinates, stops, stop_names }, lineId) {
  ROUTE_STOPS = stops;
  STOP_NAMES  = stop_names || [];

  // Remove the previous line's polyline/stop markers — drawRoute runs again
  // every time the line dropdown changes, and layers don't self-replace.
  if (routeOutline) map.removeLayer(routeOutline);
  if (routeLayer) map.removeLayer(routeLayer);
  stopMarkers.forEach(m => map.removeLayer(m));
  stopMarkers = [];
  activeStopIndex = null;

  // One continuous, solid track: a wide dark outline underneath (so the
  // route reads clearly over the light OSM tiles regardless of what's
  // under it) plus the bus's own color on top — no dashArray, no
  // per-segment polylines, just the full coordinate array in one line.
  routeOutline = L.polyline(coordinates, {
    color: '#1e293b', weight: 7, opacity: 0.35, lineJoin: 'round', lineCap: 'round',
  }).addTo(map);
  routeLayer = L.polyline(coordinates, {
    color: routeColorForLine(lineId), weight: 4, opacity: 1, lineJoin: 'round', lineCap: 'round',
  }).addTo(map);

  stops.forEach((coords, i) => {
    const marker = L.marker(coords, { icon: makeStopIcon(false) }).addTo(map);
    // Hover tooltip (not a click-required popup) shows the stop name.
    // Bound with empty content and filled in on open (rather than baked in
    // now) so it always reflects the current language even after a switch.
    marker.bindTooltip('', { permanent: false, direction: 'top', offset: [0, -12], className: 'stop-tooltip' });
    marker.on('tooltipopen', () => {
      marker.setTooltipContent(stopOptionLabel(i));
    });
    stopMarkers.push(marker);
  });
  // Reset the 3 selectors to this line's defaults *before* painting rings
  // from them — a stop index from the previous line points at a different
  // physical stop here, so preserving it would ring the wrong marker.
  populateStopSelects(false);
  refreshAllStopIcons();
  resetTripResults();
  console.log(`✓ Route drawn: ${coordinates.length} pts, ${stops.length} stops`);
}

// Clears any ETA/duration shown from a calculation made on the previous
// line — those minutes/stop names don't carry over and switching lines
// should never leave a stale result on screen.
function resetTripResults() {
  document.getElementById('my-stop-result').style.display = 'none';
  document.getElementById('my-stop-error').style.display  = 'none';
  document.getElementById('trip-result').style.display    = 'none';
  document.getElementById('trip-error').style.display     = 'none';
}

function stopOptionLabel(i) {
  // Street name only — no "Parada N" prefix, except as a fallback for the
  // rare stop with no geocoded street name.
  const street = STOP_NAMES[i];
  return street || `${I18N[currentLang].stopLabel} ${i + 1}`;
}

function populateStopSelects(preserveSelection = true) {
  const originSel = document.getElementById('trip-origin');
  const destSel    = document.getElementById('trip-destination');
  const myStopSel  = document.getElementById('my-stop-select');
  if (!ROUTE_STOPS.length || !originSel || !destSel || !myStopSel) return;

  // preserveSelection=false on a line switch — a stop index selected on
  // the previous line points at a different physical stop on this one, so
  // restoring it would silently show the wrong place instead of resetting.
  const prevOrigin = preserveSelection ? originSel.value : '';
  const prevDest   = preserveSelection ? destSel.value   : '';
  const prevMyStop = preserveSelection ? myStopSel.value : '';

  [originSel, destSel, myStopSel].forEach(sel => { sel.innerHTML = ''; });
  ROUTE_STOPS.forEach((_, i) => {
    const text = stopOptionLabel(i);
    const opt1 = document.createElement('option');
    opt1.value = i; opt1.textContent = text;
    originSel.appendChild(opt1);
    const opt2 = document.createElement('option');
    opt2.value = i; opt2.textContent = text;
    destSel.appendChild(opt2);
    const opt3 = document.createElement('option');
    opt3.value = i; opt3.textContent = text;
    myStopSel.appendChild(opt3);
  });

  if (prevOrigin !== '') originSel.value = prevOrigin;
  if (prevDest !== '') { destSel.value = prevDest; }
  else destSel.selectedIndex = ROUTE_STOPS.length - 1;
  if (prevMyStop !== '') myStopSel.value = prevMyStop;
}

// ── "use my location" → pick nearest stop ───────────────────────────────────
function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dphi = toRad(lat2 - lat1);
  const dlambda = toRad(lon2 - lon1);
  const a = Math.sin(dphi / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dlambda / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

// Highlight the corresponding map marker the instant a stop selector
// changes — same rebuildStopIcon()/selectionStateFor() path drawRoute()
// and setActiveStop() already use, so rings never fall out of sync.
['my-stop-select', 'trip-origin', 'trip-destination'].forEach(id => {
  document.getElementById(id).addEventListener('change', refreshAllStopIcons);
});

document.getElementById('use-location-btn').addEventListener('click', () => {
  const errorBox = document.getElementById('my-stop-error');
  const dict     = I18N[currentLang];
  errorBox.style.display = 'none';

  if (!navigator.geolocation) {
    errorBox.textContent   = dict.locationUnsupported;
    errorBox.style.display = 'block';
    return;
  }
  if (!ROUTE_STOPS.length) return;

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      let bestIdx = 0, bestDist = Infinity;
      ROUTE_STOPS.forEach(([slat, slon], i) => {
        const d = haversineMeters(latitude, longitude, slat, slon);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      });
      document.getElementById('my-stop-select').value = bestIdx;
      refreshAllStopIcons(); // setting .value programmatically doesn't fire 'change'
      setMyLocationMarker(latitude, longitude);
      map.fitBounds([[latitude, longitude], ROUTE_STOPS[bestIdx]], { padding: [60, 60], animate: false });
      // Otherwise the next live bus update — if it's still the first one
      // this page load has seen — immediately re-centers the map on the
      // bus via setBusPosition()'s own firstMove logic, snapping the view
      // away right after fitBounds set it deliberately.
      firstMove = false;
      errorBox.style.color   = 'var(--accent)';
      errorBox.textContent   = dict.locationSet;
      errorBox.style.display = 'block';
    },
    (err) => {
      console.warn('Geolocation error:', err);
      errorBox.style.color   = 'var(--very_high)';
      errorBox.textContent   = err.code === err.PERMISSION_DENIED ? dict.locationDenied : dict.locationError;
      errorBox.style.display = 'block';
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
});

// ── quick "when does my bus arrive?" check (single stop) ───────────────────
document.getElementById('my-stop-btn').addEventListener('click', async () => {
  const stopId    = parseInt(document.getElementById('my-stop-select').value, 10);
  const errorBox  = document.getElementById('my-stop-error');
  const resultBox = document.getElementById('my-stop-result');
  const dict      = I18N[currentLang];

  errorBox.style.display  = 'none';
  resultBox.style.display = 'none';

  try {
    const res = await fetch(TRIP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ origin_stop_id: stopId, destination_stop_id: stopId, route_id: selectedLine }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();

    document.getElementById('my-stop-eta').textContent = formatDuration(d.eta_to_origin_min);
    document.getElementById('my-stop-arrival').textContent =
      new Date(d.total_arrival_time).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    resultBox.style.display = 'block';

    if (ROUTE_STOPS[stopId]) map.setView(ROUTE_STOPS[stopId], 16, { animate: false });

    if (d.bus_already_passed) {
      errorBox.style.color   = 'var(--medium)';
      errorBox.textContent   = dict.busAlreadyPassed;
      errorBox.style.display = 'block';
    }
  } catch (err) {
    console.error('My-stop ETA error:', err);
    errorBox.style.color   = 'var(--very_high)';
    errorBox.textContent   = dict.myStopErrorGeneric;
    errorBox.style.display = 'block';
  }
});

// ── trip planner ─────────────────────────────────────────────────────────
document.getElementById('trip-calc-btn').addEventListener('click', async () => {
  const origin      = parseInt(document.getElementById('trip-origin').value, 10);
  const destination = parseInt(document.getElementById('trip-destination').value, 10);
  const errorBox    = document.getElementById('trip-error');
  const resultBox   = document.getElementById('trip-result');
  const dict        = I18N[currentLang];

  errorBox.style.color    = 'var(--very_high)';
  errorBox.style.display  = 'none';
  resultBox.style.display = 'none';

  if (destination < origin) {
    errorBox.textContent   = dict.tripErrorRange;
    errorBox.style.display = 'block';
    return;
  }

  try {
    const res = await fetch(TRIP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ origin_stop_id: origin, destination_stop_id: destination, route_id: selectedLine }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();

    document.getElementById('trip-duration').textContent = formatDuration(d.trip_duration_min);
    resultBox.style.display = 'block';

    if (ROUTE_STOPS[origin] && ROUTE_STOPS[destination]) {
      if (origin === destination) {
        map.setView(ROUTE_STOPS[origin], 16, { animate: false });
      } else {
        map.fitBounds([ROUTE_STOPS[origin], ROUTE_STOPS[destination]], { padding: [60, 60], animate: false });
      }
    }

    if (d.bus_already_passed) {
      errorBox.style.color   = 'var(--medium)';
      errorBox.textContent   = dict.busAlreadyPassed;
      errorBox.style.display = 'block';
    }
  } catch (err) {
    console.error('Trip planner error:', err);
    errorBox.style.color   = 'var(--very_high)';
    errorBox.textContent   = dict.tripErrorGeneric;
    errorBox.style.display = 'block';
  }
});

function loadRoute(lineId, attempt = 1) {
  fetch(window.location.origin + '/route?line=' + encodeURIComponent(lineId))
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => drawRoute(data, lineId))
    .catch(err => {
      console.error(`Route fetch failed (attempt ${attempt}):`, err);
      if (attempt < 5) setTimeout(() => loadRoute(lineId, attempt + 1), 2000 * attempt);
    });
}

// ── line picker ──────────────────────────────────────────────────────────
let selectedLine = '38';
let busStateByLine = {}; // last known PredictionResponse per route_id, so
                          // switching lines shows data instantly if we already have it

function switchLine(lineId) {
  selectedLine = lineId;
  loadRoute(lineId);

  const cached = busStateByLine[lineId];
  if (cached) {
    setBusPosition(cached.lat, cached.lon, cached.occupancy_class);
    updateSidebar(cached);
  } else {
    if (busMarker) { map.removeLayer(busMarker); busMarker = null; lastBusColor = null; }
    setNoDataVisible(true);
    resetSidebar();
    firstMove = true;
  }
}

function resetSidebar() {
  document.getElementById('s-eta').textContent       = '—';
  document.getElementById('s-next-stop').textContent = '—';

  document.getElementById('s-occ-fill').style.width      = '0%';
  document.getElementById('s-occ-fill').style.background = '';
  document.getElementById('s-occ-pct').textContent       = '0%';
  const badge = document.getElementById('s-occ-badge');
  badge.textContent      = '—';
  badge.style.background = '';
}

function populateLineSelect() {
  fetch(window.location.origin + '/route/lines')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(lines => {
      const sel = document.getElementById('line-select');
      sel.innerHTML = '';
      lines.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.route_id;
        opt.textContent = l.label;
        sel.appendChild(opt);
      });
      if (lines.length) {
        selectedLine = lines[0].route_id;
        sel.value = selectedLine;
      }
      switchLine(selectedLine);
    })
    .catch(err => {
      console.error('Failed to load line list, defaulting to 38:', err);
      switchLine(selectedLine);
    });
}

document.getElementById('line-select').addEventListener('change', (e) => {
  switchLine(e.target.value);
});

populateLineSelect();


// ── bus marker ───────────────────────────────────────────────────────────
function makeBusIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div class="bus-marker-wrap"><div class="bus-dot" style="background:${color}">🚌</div></div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
}

// ── "my location" marker ──────────────────────────────────────────────────
const myLocationIcon = L.divIcon({
  className: '',
  html: '<div class="bus-marker-wrap"><div class="my-location-dot"></div></div>',
  iconSize: [20, 20],
  iconAnchor: [10, 10],
});

let myLocationMarker = null;

function setMyLocationMarker(lat, lon) {
  if (!myLocationMarker) {
    myLocationMarker = L.marker([lat, lon], { icon: myLocationIcon, zIndexOffset: 500 })
      .addTo(map)
      .bindPopup('<b style="font-family:monospace">📍 Mi ubicación</b>');
  } else {
    myLocationMarker.setLatLng([lat, lon]);
  }
}

let busMarker = null;
let firstMove = true;
let lastBusColor = null;

const OCC_COLORS = {
  low:       '#22c55e',
  medium:    '#f59e0b',
  high:      '#f97316',
  very_high: '#ef4444',
};

function setNoDataVisible(visible) {
  document.getElementById('no-data').style.display = visible ? '' : 'none';
}

function setBusPosition(lat, lon, occClass) {
  setNoDataVisible(false); // showing a marker and the "no data" hint must never both be true
  const color = OCC_COLORS[occClass] || '#c2410c';
  if (!busMarker) {
    busMarker = L.marker([lat, lon], { icon: makeBusIcon(color) }).addTo(map);
    lastBusColor = color;
  } else {
    busMarker.setLatLng([lat, lon]);
    // Only rebuild the icon's DOM when the color actually changes —
    // recreating it on every tick caused the marker to flicker/disappear.
    if (color !== lastBusColor) {
      busMarker.setIcon(makeBusIcon(color));
      lastBusColor = color;
    }
  }
  if (firstMove) {
    map.setView([lat, lon], 15);
    firstMove = false;
  }
  updateActiveStopMarker(lat, lon);
}

// Highlights whichever stop marker is geographically closest to the bus
// right now (the "próxima parada" shown in the sidebar) — swaps just the
// two affected icons instead of rebuilding all 21 markers on every tick.
function setActiveStop(idx) {
  if (idx === activeStopIndex) return;
  const prevIdx = activeStopIndex;
  activeStopIndex = idx;
  // Rebuild through rebuildStopIcon() (not a bare makeStopIcon(..., false))
  // so any selection rings already on these two stops survive the swap.
  if (prevIdx !== null) rebuildStopIcon(prevIdx);
  rebuildStopIcon(idx);
}

function updateActiveStopMarker(lat, lon) {
  const n = ROUTE_STOPS.length;
  if (!n) return;

  if (activeStopIndex === null) {
    // No baseline yet (line just loaded) — do one global nearest-of-all
    // search to find a starting point.
    let nearestIdx = 0, nearestDist = Infinity;
    ROUTE_STOPS.forEach(([slat, slon], i) => {
      const d = haversineMeters(lat, lon, slat, slon);
      if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
    });
    setActiveStop(nearestIdx);
    return;
  }

  // After that, only compare against the current stop and its immediate
  // neighbors (previous/next), never all 21. Real streets curve, so a
  // straight-line "nearest of all" search can briefly find an already-
  // passed stop closer than the one actually ahead and jump the highlight
  // backward — restricting the candidates to adjacent stops means it can
  // only ever step one stop forward or back, matching how the bus is
  // actually moving along the route.
  const candidates = [activeStopIndex, (activeStopIndex + 1) % n, (activeStopIndex - 1 + n) % n];
  let bestIdx = activeStopIndex;
  let bestDist = haversineMeters(lat, lon, ROUTE_STOPS[activeStopIndex][0], ROUTE_STOPS[activeStopIndex][1]);
  candidates.forEach(i => {
    const [slat, slon] = ROUTE_STOPS[i];
    const d = haversineMeters(lat, lon, slat, slon);
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  });
  setActiveStop(bestIdx);
}

// ── sidebar update ───────────────────────────────────────────────────────
function updateSidebar(d) {
  setNoDataVisible(false);

  document.getElementById('s-eta').textContent     = formatDuration(d.eta_minutes);
  document.getElementById('s-next-stop').textContent = d.next_stop || '—';

  // occupancy
  const pct   = d.occupancy_pct ?? 0;
  const cls   = d.occupancy_class ?? 'low';
  const color = OCC_COLORS[cls] || '#22c55e';
  const fill  = document.getElementById('s-occ-fill');
  fill.style.width      = pct + '%';
  fill.style.background = color;
  document.getElementById('s-occ-pct').textContent   = pct.toFixed(0) + '%';
  const badge = document.getElementById('s-occ-badge');
  badge.textContent    = cls.replace('_', ' ').toUpperCase();
  badge.style.background = color;
}

// ── WebSocket connection ─────────────────────────────────────────────────
let ws;

function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    document.getElementById('conn-dot').classList.add('live');
    document.getElementById('conn-label').textContent = I18N[currentLang].connectingLive;
  };

  ws.onmessage = (evt) => {
    try {
      const d = JSON.parse(evt.data);
      busStateByLine[d.route_id] = d;
      // Both lines' simulators broadcast on the same socket — only touch
      // the map/sidebar when the message matches the line currently shown.
      if (d.route_id === selectedLine) {
        setBusPosition(d.lat, d.lon, d.occupancy_class);
        updateSidebar(d);
      }
    } catch (e) { console.warn('parse error', e); }
  };

  ws.onclose = () => {
    document.getElementById('conn-dot').classList.remove('live');
    document.getElementById('conn-label').textContent = I18N[currentLang].disconnectedRetry;
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => ws.close();
}

applyI18n();
connectWS();

// ── also poll /predict/eta/broadcast for direct HTTP demo ────────────────
// (useful if WS isn't used yet — the simulator can just POST to /predict/eta/broadcast)
</script>
</body>
</html>
